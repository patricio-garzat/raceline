<!doctype html><meta charset="utf-8"><style>html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:#0A0E15}svg{display:block;width:1024px;height:1024px}</style>
<!-- RaceLine · ícono de la app. Una "R" hecha con una calle de carreras: pianos rojos y blancos, línea de carrera ámbar y un monoplaza que sale de la pierna de la R. -->
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22324B"/><stop offset=".5" stop-color="#131C2B"/><stop offset="1" stop-color="#0A0E15"/></linearGradient>
    <radialGradient id="glow" cx=".74" cy=".8" r=".62"><stop offset="0" stop-color="#F2A65A" stop-opacity=".26"/><stop offset="1" stop-color="#F2A65A" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx=".2" cy=".12" r=".55"><stop offset="0" stop-color="#6E9BE0" stop-opacity=".22"/><stop offset="1" stop-color="#6E9BE0" stop-opacity="0"/></radialGradient>
    <linearGradient id="amber" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FFC986"/><stop offset=".55" stop-color="#F7A55A"/><stop offset="1" stop-color="#F2705B"/></linearGradient>

    <path id="r2" d="M50 52 L82 90"/>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#carbon)"/>
  <rect width="1024" height="1024" fill="url(#glow2)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

      <use href="#r2" stroke="#C8453B" stroke-width="21.5" stroke-dasharray="4.4 4.4"/>
      <use href="#r2" stroke="#F3EBDD" stroke-width="21.5" stroke-dasharray="4.4 4.4" stroke-dashoffset="4.4"/>
    </g>

    </g>

    </g>

    <g stroke="#F2A65A" stroke-linecap="round" fill="none" opacity=".75"><path d="M73 77 L66 70" stroke-width="1.4"/><path d="M76 74 L70 66.5" stroke-width=".8"/></g>
  </g>
</svg>
