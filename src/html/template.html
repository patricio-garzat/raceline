<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="RaceLine: a calm top-down racing puzzle. Draw the fastest line, then watch your car race. By BluBer Games.">
<title>RaceLine</title>
<link rel="icon" type="image/png" href="brand/favicon.png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
<script>
(function () {
  var d = document.documentElement; d.classList.add("booting");
  try { if (window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) d.classList.add("native"); } catch (e) {}
  try { var s = JSON.parse(localStorage.getItem("raceline-settings-v1") || "{}"), t = s.theme || "auto"; d.dataset.theme = (t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches)) ? "dark" : "light"; } catch (e) {}
})();
</script>
<style>
/*CSS*/
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="probe"></div>

<!-- Inicio -->
<section class="screen home" id="scr-home">
  <header class="lv-top"><button class="icon-btn" id="lv-back" data-i-label="back"><svg class="ic" viewBox="0 0 24 24" data-ic="back"></svg></button><h2 data-i="levels"></h2><button class="icon-btn" id="lv-new" data-i-label="c_new"><svg class="ic" viewBox="0 0 24 24" data-ic="plus"></svg></button><div class="total" id="total"><svg viewBox="0 0 24 24" class="on" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2 6.3 20.3l1.2-6.4L2.8 9.5l6.4-.8z"/></svg><b id="total-n">0</b><span id="total-of"></span></div></header>
  <div class="kerb"></div>
  <div class="levels" id="levels"></div>
</section>

<!-- Página de inicio -->
<section class="screen title" id="scr-title">
  <div class="tt-mid"><img class="tt-mark" id="tt-mark" alt="RaceLine"><p data-i="tagline"></p><label class="tt-driver"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 12.2a3.7 3.7 0 1 0 0-7.4 3.7 3.7 0 0 0 0 7.4zM4.8 20c.6-3.6 3.3-5.6 7.2-5.6s6.6 2 7.2 5.6"/></svg><input id="tt-driver" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" data-i-ph="tt_driver"></label></div>
  <div class="tt-bot">
    <button class="tt-play" id="tt-play" data-tap><img class="tt-flag" id="tt-flag" alt=""><span class="tt-lbl"><small id="tt-next"></small><b id="tt-name"></b></span><span class="tt-go"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></span></button>
    <button class="tt-levels" id="tt-levels"><span data-i="levels"></span><em id="tt-stars"></em></button>
    <nav class="tt-nav">
      <button class="nav-btn" data-go="garage"><svg class="ic" viewBox="0 0 24 24" data-ic="car"></svg><span data-i="garage"></span></button>
      <button class="nav-btn" data-go="how"><svg class="ic" viewBox="0 0 24 24" data-ic="how"></svg><span data-i="how"></span></button>
      <button class="nav-btn" data-go="records"><svg class="ic" viewBox="0 0 24 24" data-ic="records"></svg><span data-i="records"></span></button>
      <button class="nav-btn" data-go="settings"><svg class="ic" viewBox="0 0 24 24" data-ic="settings"></svg><span data-i="settings"></span></button>
    </nav>
  </div>
</section>

<!-- Garaje -->
<section class="screen sub" id="scr-garage">
  <header class="sub-h"><button class="icon-btn" data-back data-i-label="back"><svg class="ic" viewBox="0 0 24 24" data-ic="back"></svg></button><h2 data-i="garage"></h2></header>
  <div class="sub-c garage">
    <div class="g-stage" id="g-stage"><canvas id="g-car"></canvas><div class="g-float"><button id="g-undo" aria-label="Undo"></button><button id="g-redo" aria-label="Redo"></button><button id="g-mirror" aria-label="Mirror"></button><button id="g-clear" aria-label="Clear"></button></div></div>
    <div class="seg g-tabs" id="g-tabs"><button data-t="presets" data-i="g_presets"></button><button data-t="colors" data-i="g_colors"></button><button data-t="stripes" data-i="g_stripes"></button><button data-t="number" data-i="g_number"></button><button data-t="paint" data-i="g_paint"></button></div>
    <div class="g-panel" id="g-panel"></div>
  </div>
</section>

<!-- Cómo jugar -->
<section class="screen sub" id="scr-how">
  <header class="sub-h"><button class="icon-btn" data-back data-i-label="back"><svg class="ic" viewBox="0 0 24 24" data-ic="back"></svg></button><h2 data-i="how"></h2></header>
  <div class="sub-c">
    <div class="step"><span class="step-art"><svg viewBox="0 0 88 60"><path d="M10 50 C 8 24, 36 14, 78 16" fill="none" stroke="var(--thumb-road)" stroke-width="17" stroke-linecap="round"/><path d="M10 48 C 10 28, 38 19, 76 19" fill="none" stroke="#FD1C22" stroke-width="3.2" stroke-linecap="round"/><circle cx="76" cy="19" r="9" fill="rgba(255,255,255,.35)"/><circle cx="76" cy="19" r="5" fill="#fff"/></svg></span><div><b data-i="how1_t"></b><p data-i="how1_d"></p></div></div>
    <div class="step"><span class="step-art"><svg viewBox="0 0 88 60"><path d="M14 56 L14 32 Q14 12 34 12 L84 12" fill="none" stroke="var(--thumb-road)" stroke-width="22" stroke-linejoin="round"/><path d="M14 56 L14 32 Q14 12 34 12 L84 12" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.6" stroke-dasharray="4 5"/><path d="M6 56 L6 34 Q8 21 21 18 Q36 16 52 17 L84 17" fill="none" stroke="#FD1C22" stroke-width="3" stroke-linecap="round"/></svg></span><div><b data-i="how2_t"></b><p data-i="how2_d"></p></div></div>
    <div class="step"><span class="step-art"><svg viewBox="0 0 88 60"><rect x="0" y="16" width="88" height="28" fill="var(--thumb-road)"/><rect x="0" y="14" width="88" height="3" fill="#FD1C22"/><rect x="0" y="43" width="88" height="3" fill="#FD1C22"/><path d="M6 30 C 24 30, 30 8, 46 8" fill="none" stroke="#FD1C22" stroke-width="2.4" stroke-dasharray="3 4" stroke-linecap="round" opacity=".7"/><path d="M6 30 C 24 30, 30 17, 46 17 L84 17" fill="none" stroke="#FD1C22" stroke-width="3" stroke-linecap="round"/></svg></span><div><b data-i="how3_t"></b><p data-i="how3_d"></p></div></div>
    <div class="step"><span class="step-art"><svg viewBox="0 0 88 60"><rect x="8" y="30" width="22" height="26" rx="3" fill="#B9C0C8"/><rect x="33" y="20" width="22" height="36" rx="3" fill="#FD1C22"/><rect x="58" y="38" width="22" height="18" rx="3" fill="#C98F5A"/><g fill="#FD1C22" stroke="#E0161C" stroke-width="1.2" stroke-linejoin="round"><path transform="translate(35 3) scale(.75)" d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2 6.3 20.3l1.2-6.4L2.8 9.5l6.4-.8z"/><path transform="translate(23 3) scale(.75)" d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2 6.3 20.3l1.2-6.4L2.8 9.5l6.4-.8z"/><path transform="translate(47 3) scale(.75)" d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2 6.3 20.3l1.2-6.4L2.8 9.5l6.4-.8z"/></g></svg></span><div><b data-i="how4_t"></b><p data-i="how4_d"></p></div></div>
  </div>
</section>

<!-- Récords -->
<section class="screen sub" id="scr-records">
  <header class="sub-h"><button class="icon-btn" data-back data-i-label="back"><svg class="ic" viewBox="0 0 24 24" data-ic="back"></svg></button><h2 data-i="records"></h2></header>
  <div class="sub-c" id="rec-list"></div>
</section>

<!-- Ajustes -->
<section class="screen sub" id="scr-settings">
  <header class="sub-h"><button class="icon-btn" data-back data-i-label="back"><svg class="ic" viewBox="0 0 24 24" data-ic="back"></svg></button><h2 data-i="settings"></h2></header>
  <div class="sub-c">
    <div class="group">
      <div class="row"><span data-i="set_sound"></span><button class="toggle" id="t-sound" role="switch" aria-checked="true" data-quiet></button></div>
      <div class="row"><span data-i="set_music"></span><button class="toggle" id="t-music" role="switch" aria-checked="true" data-quiet></button></div>
      <div class="row"><span><span data-i="set_haptics"></span><small id="haptics-note"></small></span><button class="toggle" id="t-haptics" role="switch" aria-checked="true"></button></div>
      <div class="row"><span data-i="set_theme"></span><div class="seg" id="seg-theme"><button data-v="auto" data-i="theme_auto"></button><button data-v="light" data-i="theme_light"></button><button data-v="dark" data-i="theme_dark"></button></div></div>
      <div class="row"><span data-i="set_lang"></span><div class="seg" id="seg-lang"><button data-v="0">English</button><button data-v="1">Español</button></div></div>
      <div class="row"><button class="link" id="set-tut"><span data-i="set_tut"></span></button></div>
      <div class="row"><button class="danger" id="set-erase" data-i="set_erase"></button></div>
    </div>
    <div class="group">
      <h3 data-i="about"></h3>
      <div class="row"><span data-i="version"></span><span class="val" id="ver"></span></div>
      <div class="row"><span data-i="website"></span><a href="https://blubergames.com" target="_blank" rel="noopener">blubergames.com</a></div>
      <div class="row"><span data-i="support"></span><a href="https://blubergames.com/support/" target="_blank" rel="noopener">blubergames.com/support</a></div>
    </div>
  </div>
</section>

<section class="screen sub" id="scr-editor">
  <header class="sub-h"><button class="icon-btn" id="ed-back" data-i-label="back"><svg class="ic" viewBox="0 0 24 24" data-ic="back"></svg></button><h2 id="ed-title" data-i="c_new"></h2></header>
  <div class="ed-body">
    <div class="ed-left"><p class="ed-hint" id="ed-hint"></p><div class="ed-stage" id="ed-stage"><canvas id="ed-cv"></canvas></div></div>
    <div class="ed-panel" id="ed-panel">
      <div class="ed-row"><label data-i="c_name" for="ed-name"></label><input id="ed-name" maxlength="18" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done"></div>
      <div class="ed-row"><span data-i="c_width"></span><div class="seg" id="ed-w"><button data-v="46" data-i="c_w1"></button><button data-v="56" data-i="c_w2"></button><button data-v="68" data-i="c_w3"></button></div></div>
      <div class="ed-row"><span data-i="c_diff"></span><div class="seg" id="ed-d"><button data-v="0" data-i="c_d1"></button><button data-v="1" data-i="c_d2"></button><button data-v="2" data-i="c_d3"></button></div></div>
      <div class="ed-row col"><span data-i="c_theme"></span><div class="ed-themes" id="ed-themes"></div></div>
      <div class="ed-act"><button class="btn" id="ed-redraw" data-i="c_redraw"></button><button class="btn primary" id="ed-save" data-i="c_save"></button></div>
    </div>
  </div>
</section>

<!-- Juego -->
<div id="game-ui" class="hidden">
  <div class="ui top">
    <button class="icon-btn" id="g-back" data-i-label="back" style="pointer-events:auto"><svg class="ic" viewBox="0 0 24 24" data-ic="back"></svg></button>
    <div class="chip grow" id="chip"><img class="cf" id="chip-flag" alt=""><span class="ct"><span class="cy"><em id="chip-cty"></em><span class="rd"><span data-i="round"></span> <b id="chip-no"></b></span></span><b id="lvl"></b><small id="hint"></small></span><span class="cbg"><i class="cbar" id="chip-bar"></i></span></div>
    <div class="chip right hidden" id="hud"><small id="lap"></small><small class="pl" data-i="pos"></small><b id="pos"></b></div>
  </div>
  <div class="timing hidden" id="timing" aria-hidden="true"><span class="tm-lap" id="tm-lap"></span><b class="tm-time" id="tm-time">0:00.00</b><span class="tm-sp"></span><div class="tm-it" id="tm-lastbox"><small data-i="tm_last"></small><b id="tm-last">--</b></div><div class="tm-it"><small data-i="tm_best"></small><b id="tm-best" class="best">--</b></div><i class="tm-bar" id="tm-bar"></i></div>
  <div id="lights" aria-hidden="true"><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i></div>
  <div id="count"></div>
  <button class="boost hidden" id="boost" disabled aria-label="Boost"><svg viewBox="0 0 24 24" class="ic"><path d="M13.5 2.5L5.5 13.5h5.8l-1 8 8.2-11.2h-5.8z"/></svg><span data-i="boost"></span><i class="bst"></i></button>
  <div class="ui bottom" id="bar">
    <button class="btn" id="undo" disabled data-i="undo"></button>
    <button class="btn" id="clear" disabled data-i="clear"></button>
    <button class="btn primary" id="go" disabled data-i="start"></button>
  </div>
  <div id="result">
    <div class="res-top"><div class="medal" id="rMedal"></div><div class="res-txt"><h2 id="rTitle"></h2><p class="sub" id="rSub"></p></div></div>
    <div class="stars" id="rStars"></div>
    <div class="standings" id="rStand"></div>
    <div class="laps" id="rLaps"></div>
    <div class="stats">
      <div class="stat"><span data-i="race_time"></span><b id="rTime"></b></div>
      <div class="stat"><span data-i="vs_best"></span><b id="rLine"></b></div>
    </div>
    <button class="btn primary wide" id="rNext" data-i="next"></button>
    <div class="row2">
      <button class="btn" id="rMenu" data-i="menu"></button>
      <button class="btn" id="rRedraw" data-i="redraw"></button>
      <button class="btn" id="rAgain" data-i="again"></button>
    </div>
    <button class="btn wide home" id="rHome" data-i="home"></button>
  </div>
</div>

<div id="sheet"><div class="dlg"><h3 id="sh-name"></h3><button class="btn primary wide" id="sh-race" data-i="c_race"></button><div class="row2"><button class="btn" id="sh-edit" data-i="c_edit"></button><button class="btn" id="sh-del" data-i="c_delete"></button></div></div></div>
<div id="dialog"><div class="dlg"><p id="dlg-msg"></p><div class="row2"><button class="btn" id="dlg-no"></button><button class="btn primary" id="dlg-ok"></button></div></div></div>

<!--STUDIO-->

<script>window.APP_VERSION = "web";</script>
<script>
/*JS*/
</script>
</body>
</html>
